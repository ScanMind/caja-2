<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#17211f;--tx2:#5b6b67;--bd:#dbe3e0;--acc:#0d7a6b;--onacc:#fff;--acc-bg:#dff3ef;--red:#b42318;--red-bg:#fdeceb;--grn:#157347;--grn-bg:#e3f5ea;--amb:#8a5600;--amb-bg:#fdf1d8;--c1:#2563eb;--c2:#16803c;--c3:#c2570c;--c4:#7c3aed;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101615;--card:#1a2321;--tx:#eaf1ef;--tx2:#9fb2ad;--bd:#2c3a37;--acc:#3fc2ad;--onacc:#06211c;--acc-bg:#12332d;--red:#f4a6a0;--red-bg:#3b1815;--grn:#8fd9a8;--grn-bg:#12321f;--amb:#f0c36a;--amb-bg:#3a2a0a;--c1:#7aa2ff;--c2:#6fd48f;--c3:#ff9f5a;--c4:#b69cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101615;--card:#1a2321;--tx:#eaf1ef;--tx2:#9fb2ad;--bd:#2c3a37;--acc:#3fc2ad;--onacc:#06211c;--acc-bg:#12332d;--red:#f4a6a0;--red-bg:#3b1815;--grn:#8fd9a8;--grn-bg:#12321f;--amb:#f0c36a;--amb-bg:#3a2a0a;--c1:#7aa2ff;--c2:#6fd48f;--c3:#ff9f5a;--c4:#b69cff;color-scheme:dark}
:root[data-ac="azul"]{--acc:#1d4ed8;--acc-bg:#e0e9ff;--onacc:#fff}
:root[data-ac="morado"]{--acc:#6d28d9;--acc-bg:#eee5ff;--onacc:#fff}
:root[data-ac="naranja"]{--acc:#b45309;--acc-bg:#ffe9d6;--onacc:#fff}
@media (prefers-color-scheme:dark){:root[data-ac="azul"]:not([data-theme="light"]){--acc:#8ab0ff;--acc-bg:#14295a;--onacc:#06142f}:root[data-ac="morado"]:not([data-theme="light"]){--acc:#c1a6ff;--acc-bg:#2a1a55;--onacc:#1a0b3a}:root[data-ac="naranja"]:not([data-theme="light"]){--acc:#ffa863;--acc-bg:#4a2408;--onacc:#2a1204}}
:root[data-theme="dark"][data-ac="azul"]{--acc:#8ab0ff;--acc-bg:#14295a;--onacc:#06142f}
:root[data-theme="dark"][data-ac="morado"]{--acc:#c1a6ff;--acc-bg:#2a1a55;--onacc:#1a0b3a}
:root[data-theme="dark"][data-ac="naranja"]{--acc:#ffa863;--acc-bg:#4a2408;--onacc:#2a1204}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.45}
main{max-width:32.5rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 0.875rem) 0.875rem 6.875rem}
h1{font-size:1.375rem;margin:0 0 2px}
h2{font-size:1.0625rem;margin:0 0 0.5rem}
.sub{color:var(--tx2);font-size:0.875rem;margin:0 0 0.875rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:0.875rem;padding:0.875rem;margin-bottom:0.75rem}
.nav{display:flex;gap:0.5rem;margin-bottom:0.75rem}
.nav button,.nav input{height:2.875rem;border:1px solid var(--bd);border-radius:0.75rem;background:var(--card);color:var(--tx);font:inherit}
.nav button{padding:0 1rem;font-size:1.125rem;cursor:pointer}
.nav input,.nav .lb{flex:1;min-width:0}
.nav .lb{display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;font-size:0.875rem}
.nav input{padding:0 0.625rem}
.in{display:block;background:var(--card);border:1px solid var(--bd);border-left:0.375rem solid var(--c);border-radius:0.875rem;padding:0.75rem 0.875rem;margin-bottom:0.625rem}
.in .lb{display:block;font-weight:700;font-size:1.0625rem;color:var(--c)}
.in .sb{display:block;font-size:0.8438rem;color:var(--tx2);margin-bottom:0.375rem}
.box{display:flex;align-items:center;gap:0.5rem}
.box i{font-style:normal;color:var(--tx2);font-weight:600}
.box input{flex:1;min-width:0;height:3.125rem;border:1px solid var(--bd);border-radius:0.625rem;background:var(--bg);color:var(--tx);font:inherit;font-size:1.5rem;font-weight:600;padding:0 0.75rem}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.row{display:flex;justify-content:space-between;gap:0.625rem;padding:0.5rem 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row b{white-space:nowrap}
.pos{color:var(--grn)}.neg{color:var(--red)}
.al{border-radius:0.625rem;padding:0.6875rem 0.8125rem;margin-bottom:0.625rem;font-size:0.9375rem;font-weight:600}
.al.big{font-size:1.125rem;border-left:0.375rem solid currentColor}
.al.r{background:var(--red-bg);color:var(--red)}.al.a{background:var(--amb-bg);color:var(--amb)}.al.g{background:var(--grn-bg);color:var(--grn)}.al.b{background:var(--acc-bg);color:var(--acc)}
.vd{border-radius:0.875rem;padding:1rem;margin-bottom:0.75rem;font-size:1.1875rem;font-weight:800;line-height:1.25}
.vd.r{background:var(--red-bg);color:var(--red)}.vd.g{background:var(--grn-bg);color:var(--grn)}.vd.b{background:var(--acc-bg);color:var(--acc)}
.bar{position:relative;height:1.375rem;border-radius:0.6875rem;background:var(--bd);overflow:hidden;margin:0.5rem 0}
.bar>span{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:0.6875rem}
.bar>em{position:absolute;top:0;bottom:0;width:3px;background:var(--tx);opacity:.55}
.pct{font-size:2.125rem;font-weight:800}
.pay{display:flex;gap:0.75rem;align-items:center;padding:0.6875rem 0;border-bottom:1px solid var(--bd)}
.pay:last-child{border-bottom:0}
.pay input[type=checkbox]{width:1.75rem;height:1.75rem;flex:none;accent-color:var(--acc)}
.pay .t{flex:1;min-width:0}
.pay .t b{display:block}
.pay .t small{font-size:0.8438rem;color:var(--tx2)}
.pay .t small.r{color:var(--red);font-weight:700}.pay .t small.a{color:var(--amb);font-weight:700}
.pay.done .t{opacity:.55;text-decoration:line-through}
.pay .am{font-weight:700;white-space:nowrap}
.btn{width:100%;height:3.125rem;border:0;border-radius:0.75rem;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:0.625rem}
.btn.o{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.g{background:var(--grn);color:var(--card)}
.btn.s{height:2.25rem;width:auto;padding:0 0.75rem;margin:0;font-size:0.8125rem;background:transparent;color:var(--tx2);border:1px solid var(--bd);font-weight:600}
.bk{border:0;background:transparent;color:var(--acc);font:inherit;font-weight:700;font-size:1rem;padding:0.375rem 0;margin-bottom:0.375rem;cursor:pointer}
.txt{width:100%;height:2.875rem;border:1px solid var(--bd);border-radius:0.625rem;background:var(--bg);color:var(--tx);font:inherit;padding:0 0.75rem;margin-top:0.5rem}
textarea.txt{height:6rem;padding:0.625rem;font-size:0.8125rem}
.lbl{display:block;font-size:0.8438rem;color:var(--tx2);margin-top:0.625rem}
.mn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:0.875rem;padding:0.875rem;margin-bottom:0.625rem;color:var(--tx);font:inherit;cursor:pointer}
.mn b{display:block;font-size:1.0625rem}
.mn span{font-size:0.875rem;color:var(--tx2)}
.seg{display:flex;gap:0.375rem;margin-top:0.375rem}
.seg button{flex:1;height:2.75rem;border:1px solid var(--bd);border-radius:0.625rem;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
.hr{display:flex;justify-content:space-between;gap:0.5rem;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--bd);padding:0.625rem 0;color:var(--tx);font:inherit;cursor:pointer}
.hr small{display:block;color:var(--tx2);font-size:0.8125rem}
.tip{padding:0.625rem 0;border-bottom:1px solid var(--bd)}
.tip:last-child{border-bottom:0}
.tip b{display:block}
.tip span{color:var(--tx2);font-size:0.9375rem}
.note{font-size:0.8125rem;color:var(--tx2);margin-top:0.625rem}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:32.5rem;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:0 4px calc(0.375rem + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;height:3.5rem;border:0;border-top:4px solid transparent;background:transparent;color:var(--tx2);font:inherit;font-size:0.875rem;cursor:pointer;padding:0 1px}
.tabs button.on{color:var(--acc);font-weight:800;border-top-color:var(--acc)}
@media print{body{background:#fff;color:#000}.tabs,#al,.noprint,.bk{display:none!important}main{max-width:none;padding:0}.card{break-inside:avoid;border-color:#999;background:#fff}:root{--tx:#000;--tx2:#333;--bd:#999;--grn:#0a5;--red:#a00}}
</style>

<body>
<main><div id="al"></div><div id="v"></div></main>
<nav class="tabs" id="tabs"></nav>
<script>
var KEY="micaja.v1",S,tab="hoy",sub=null,sel,selW,selE,editIdx=-1;
var BASE=[{n:"Alquiler casa",d:5,a:18000},{n:"Alquiler local",d:7,a:7500},{n:"Préstamo 2",d:15,a:13550},{n:"Teléfonos",d:20,a:3200},{n:"Luz",d:22,a:4000},{n:"Préstamo 1",d:28,a:10200}];
var LOCAL=11700;
var MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var DS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var FIELDS=[["lot","Lotería","Lo que cobraste hoy de lotería","--c1"],["med","Farmacia","Lo que vendiste hoy en la farmacia","--c2"],["food","Comida y gastos","Lo que sacaste hoy para comida y gastos","--c3"],["inv","Inversión","Lo que gastaste hoy en productos y medicamentos","--c4"]];
function load(){var o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=(o&&typeof o==="object")?o:{};
var D={days:{},paid:{},custom:[],over:{},adj:[],weeks:{},est:750,mg:25,cash:"",gx:"",arrears:23000,gainA:22000,mode:"auto",ac:"verde",fs:1,inv:null,recv:[],debts:[{id:1,n:"Préstamo 1",bal:335000,ini:335000,link:"Préstamo 1",mv:[]},{id:2,n:"Préstamo 2",bal:200000,ini:200000,link:"Préstamo 2",mv:[]},{id:3,n:"Tarjeta de crédito",bal:25000,ini:25000,cuota:5000,pd:0,cd:0,card:1,mv:[]}]};
for(var k in D)if(S[k]==null)S[k]=D[k]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function p2(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function wedOf(d){var x=addD(d,0);while(x.getDay()!==3)x=addD(x,-1);return x}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function money(n){var r=Math.round(n);return (r<0?"-":"")+"RD$"+Math.abs(r).toLocaleString("en-US")}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function lab(d){return DS[d.getDay()]+" "+d.getDate()+" de "+MES[d.getMonth()]}
function inp(id,ph,v){return '<input class="txt" id="'+id+'" type="number" inputmode="decimal" placeholder="'+ph+'" value="'+(v===undefined||v===null?"":v)+'">'}
function GAIN(){return{n:"Ganancia de lotería",d:5,a:num(S.gainA)}}
function pays(){var a=BASE.map(function(p){var o=S.over[p.n]||{};return{n:p.n,d:o.d||p.d,a:o.a!=null?o.a:p.a}});var c=a.concat(S.custom.map(function(p){return{n:p.n,d:p.d,a:p.a}}));(S.debts||[]).forEach(function(d){if(!d.link&&d.pd>0&&num(d.cuota)>0)c.push({n:d.n+(d.card?" (mínimo)":" (cuota)"),d:d.pd,a:num(d.cuota),der:1})});return c}
function pkey(p,t){return t.getFullYear()+"-"+(t.getMonth()+1)+":"+p.n}
function dueDate(p,y,m){var dim=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(p.d,dim))}
function dueIn(p,t){return Math.round((dueDate(p,t.getFullYear(),t.getMonth())-t)/864e5)}
function when(p,t){var d=dueIn(p,t);return d<0?["Venció hace "+(-d)+(d===-1?" día":" días"),"r"]:d===0?["Vence hoy","r"]:d===1?["Vence mañana","a"]:["Faltan "+d+" días",d<=3?"a":""]}
function hasData(x){return x&&(num(x.lot)||num(x.med)||num(x.food)||num(x.inv))}
function monthStats(t,closedOnly){var pre=t.getFullYear()+"-"+p2(t.getMonth()+1),r={lot:0,med:0,food:0,inv:0,n:0,foodToday:false};
for(var k in S.days)if(k.indexOf(pre)===0){var x=S.days[k];if(closedOnly&&!x.closed)continue;r.lot+=num(x.lot);r.med+=num(x.med);r.food+=num(x.food);r.inv+=num(x.inv);r.n++}
var x2=S.days[iso(t)];if(x2&&x2.food!==undefined&&x2.food!=="")r.foodToday=true;return r}
function unclosed(){var tk=iso(today()),a=[];for(var k in S.days)if(k<tk&&hasData(S.days[k])&&!S.days[k].closed)a.push(k);return a.sort()}
function upcoming(t){var pay7=0,in7=0,list=[];
for(var mm=0;mm<2;mm++){var y=t.getFullYear(),m=t.getMonth()+mm;
pays().forEach(function(p){var dd=dueDate(p,y,m),diff=Math.round((dd-t)/864e5);if(diff>7)return;if(S.paid[pkey(p,dd)])return;pay7+=p.a;list.push(p.n+" "+money(p.a)+(diff<0?" (vencido)":diff===0?" (hoy)":" (día "+p.d+")"))});
var g=GAIN(),gd=dueDate(g,y,m),gdiff=Math.round((gd-t)/864e5);if(gdiff>=0&&gdiff<=7&&!S.paid[pkey(g,gd)])in7+=g.a}
return{pay7:pay7,in7:in7,list:list}}
function applyLook(){var r=document.documentElement;r.style.fontSize=(16*(S.fs||1))+"px";if(S.mode==="light"||S.mode==="dark")r.setAttribute("data-theme",S.mode);else r.removeAttribute("data-theme");if(S.ac&&S.ac!=="verde")r.setAttribute("data-ac",S.ac);else r.removeAttribute("data-ac")}
function setTab(x){tab=x;sub=null;editIdx=-1;draw()}
function goSub(x){sub=x;draw()}
function goDay(k){sel=pd(k);tab="hoy";sub=null;draw()}
function alerts(){var t=today(),b="";pays().forEach(function(p){if(S.paid[pkey(p,t)])return;var d=dueIn(p,t);if(d<=3){var w=when(p,t);b+='<div class="al big '+(d<=0?"r":"a")+'">'+w[0]+"<br>"+p.n+", "+money(p.a)+"</div>"}});return b}
function draw(){applyLook();var h="";[["hoy","Hoy"],["pag","Pagos"],["mes","Mes"],["inv","Inversión"],["mas","Más"]].forEach(function(x){h+='<button class="'+(tab===x[0]?"on":"")+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+"</button>"});
$("tabs").innerHTML=h;$("al").innerHTML=alerts();
if(tab==="hoy")vHoy();else if(tab==="pag")vPag();else if(tab==="mes")vMes();else if(tab==="inv")vInv();else vMas();window.scrollTo(0,0)}
/* ---- HOY ---- */
function vHoy(){
var s=iso(sel),r=S.days[s]||{};
var h='<h1>Hoy</h1><p class="sub" id="dl"></p><div class="nav"><button onclick="mv(-1)" aria-label="Día anterior">‹</button><input type="date" id="dt" value="'+s+'"><button onclick="mv(1)" aria-label="Día siguiente">›</button></div><div id="nc"></div>';
FIELDS.forEach(function(f){h+='<label class="in" style="--c:var('+f[3]+')"><span class="lb">'+f[1]+'</span><span class="sb">'+f[2]+'</span><div class="box"><i>RD$</i><input id="f_'+f[0]+'" type="number" inputmode="decimal" min="0" placeholder="0" value="'+(r[f[0]]===undefined?"":r[f[0]])+'"></div></label>'});
h+='<div class="card" id="sm"></div><button class="btn" id="cl"></button><div class="note">Se guarda solo mientras escribes. Al cerrar el día, cuenta en el progreso del mes.</div>';
$("v").innerHTML=h;
FIELDS.forEach(function(f){$("f_"+f[0]).addEventListener("input",function(){var x=S.days[s]||(S.days[s]={});x[f[0]]=$("f_"+f[0]).value;if(x.closed)x.snap=stmt(sel,false);save();upd()})});
$("dt").addEventListener("change",function(){if($("dt").value){sel=pd($("dt").value);vHoy()}});
$("cl").addEventListener("click",function(){var x=S.days[s]||(S.days[s]={});x.closed=!x.closed;if(x.closed)x.snap=stmt(sel,false);else delete x.snap;save();upd()});
upd()}
function mv(n){sel=addD(sel,n);vHoy()}
function upd(){
var s=iso(sel),r=S.days[s]||{},t=today();
$("dl").textContent=lab(sel)+(s===iso(t)?" (hoy)":"");
var g=num(r.med)-num(r.inv),n=g-num(r.food);
$("sm").innerHTML='<h2>'+(r.closed?"Día cerrado ✓":"Resumen del día")+'</h2><div class="row"><span>Ganancia de farmacia (ventas − inversión)</span><b class="'+(g<0?"neg":"pos")+'">'+money(g)+'</b></div><div class="row"><span>Después de comida y gastos</span><b class="'+(n<0?"neg":"pos")+'">'+money(n)+'</b></div><div class="row"><span>Lotería de hoy, para depositar</span><b>'+money(num(r.lot))+'</b></div><div class="note">El dinero de lotería no es tuyo: no lo mezcles con tu ganancia.</div>';
var c=$("cl");c.textContent=r.closed?"Día cerrado. Toca para reabrir":"Cerrar el día";c.className="btn"+(r.closed?" g":"");
var u=unclosed(),b="";if(u.length)b='<div class="al a">Tienes '+u.length+(u.length===1?" día anterior sin cerrar.":" días anteriores sin cerrar.")+' <button class="btn s" style="margin-top:6px" onclick="goDay(\''+u[0]+'\')">Ir al más antiguo</button></div>';
$("nc").innerHTML=b}
/* ---- PAGOS ---- */
function vPag(){
var t=today(),G=GAIN(),list=pays().map(function(p,i){return{p:p,i:i,d:dueIn(p,t),ok:!!S.paid[pkey(p,t)]}});
list.sort(function(a,b){return a.ok-b.ok||a.d-b.d});
var h='<h1>Pagos del mes</h1><p class="sub">'+MES[t.getMonth()]+". Marca lo que ya pagaste.</p>";
var nx=list.filter(function(x){return!x.ok})[0];
if(nx){var w=when(nx.p,t);h+='<div class="al '+(w[1]==="r"?"r":w[1]==="a"?"a":"b")+'">Próximo: '+nx.p.n+", "+money(nx.p.a)+". "+w[0]+".</div>"}else h+='<div class="al g">No tienes pagos pendientes este mes.</div>';
h+='<div class="card">';
list.forEach(function(x){var w=when(x.p,t);
h+='<div class="pay'+(x.ok?" done":"")+'"><input type="checkbox" '+(x.ok?"checked":"")+' onchange="tp('+x.i+')" aria-label="Pagado"><div class="t"><b>'+x.p.n+'</b><small class="'+(x.ok?"":w[1])+'">Día '+x.p.d+(x.ok?", pagado":", "+w[0])+'</small></div><span class="am">'+money(x.p.a)+'</span>'+(x.p.der?"":'<button class="btn s" onclick="edP('+x.i+')">Editar</button>')+'</div>';
if(editIdx===x.i){h+='<div style="padding:4px 0 12px"><span class="lbl">Día del mes</span><input class="txt" id="ed" type="number" inputmode="numeric" value="'+x.p.d+'"><span class="lbl">Monto en RD$</span><input class="txt" id="ea" type="number" inputmode="decimal" value="'+x.p.a+'"><button class="btn" onclick="svP('+x.i+')">Guardar cambios</button>'+(x.i>=BASE.length?'<button class="btn o" onclick="rm('+(x.i-BASE.length)+')">Quitar este pago</button>':"")+"</div>"}});

h+='<div class="card"><h2>Agregar una deuda</h2><input class="txt" id="dn" placeholder="Nombre (ej. Préstamo 3)"><input class="txt" id="db" type="number" inputmode="decimal" placeholder="Saldo que debes (RD$)"><input class="txt" id="dc" type="number" inputmode="decimal" placeholder="Cuota mensual (RD$)"><input class="txt" id="dd" type="number" inputmode="numeric" placeholder="Día de pago (opcional)"><button class="btn" onclick="addDb()">Agregar</button></div>';

if(a<=0)h+='<div class="vd b">Escribe un monto para ver si alcanza.</div>';else if(left>=0)h+='<div class="vd g">Alcanza. Te quedarían '+money(left)+' sobre lo que necesitas para 7 días.</div>';else h+='<div class="vd r">No alcanza. Te faltarían '+money(-left)+' para cubrir los próximos 7 días.</div>';
h+='<div class="card"><h2>La cuenta de 7 días</h2><div class="row"><span>Tu efectivo propio</span><b>'+money(c)+'</b></div><div class="row"><span>− Monto a gastar</span><b>'+money(a)+'</b></div><div class="row"><span>− Pagos de los próximos 7 días</span><b>'+money(U.pay7)+'</b></div><div class="row"><span>− Comida y pasaje (7 días)</span><b>'+money(f)+'</b></div>'+(U.in7>0?'<div class="row"><span>+ Entradas esperadas</span><b>'+money(U.in7)+'</b></div>':"")+'<div class="row"><span><b>Te quedaría</b></span><b class="'+(left<0?"neg":"pos")+'">'+money(left)+'</b></div>'+(U.list.length?'<div class="note">Pagos que cuenta: '+U.list.join(", ")+'. Si alguno ya lo pagaste, márcalo en Pagos.</div>':"")+'</div>';
$("go").innerHTML=h}
/* historial */
function vHis(){var ks=Object.keys(S.days).filter(function(k){return hasData(S.days[k])}).sort().reverse().slice(0,60);
var h=BK+'<h1>Historial</h1><p class="sub">Toca un día para verlo o corregirlo.</p><div class="card">';
if(!ks.length)h+='<div class="sub" style="margin:0">Aún no hay días anotados.</div>';
ks.forEach(function(k){var x=S.days[k],d=pd(k);h+='<button class="hr" onclick="goDay(\''+k+'\')"><span>'+lab(d)+'<small>Farmacia '+money(num(x.med))+', inversión '+money(num(x.inv))+', comida '+money(num(x.food))+', lotería '+money(num(x.lot))+'</small></span><b class="'+(x.closed?"pos":"")+'">'+(x.closed?"Cerrado ✓":"Abierto")+'</b></button>'});
$("v").innerHTML=h+'</div>'}
/* tips */
function vTip(){var t=today(),m=monthStats(t,false),ex="";
if(m.inv>m.med&&m.inv>0)ex='<div class="al a">Este mes llevas más inversión ('+money(m.inv)+') que ventas de farmacia ('+money(m.med)+'). Revisa qué productos se están quedando sin vender.</div>';else if(m.med>0)ex='<div class="al b">Este mes tu ganancia de farmacia va en '+money(m.med-m.inv)+'.</div>';
var T=[["Anota todo cada noche","Dedica 5 minutos al cerrar el día. Lo que no se anota se olvida, y los números del mes dejan de cuadrar."],["Separa el dinero de lotería","Lo que cobras de lotería es para depositar. Guárdalo aparte, en un sobre o bolsillo distinto, y no lo uses para comida ni pagos."],["Ganancia es ventas menos inversión","Vender RD$1,000 no es ganar RD$1,000. Resta lo que gastaste en productos para saber lo que de verdad te queda."],["Mira los pagos de la semana","Cada lunes revisa la pestaña Pagos y aparta ya el dinero de lo que vence en los próximos 7 días."],["Aparta cuando entra el dinero","Cuando llegue la ganancia de lotería, separa de una vez lo de los pagos grandes del mes antes de gastar en otra cosa."],["Compra lo que se vende","Repón primero los productos que salen rápido. Un producto parado es dinero guardado que no puedes usar."],["Cuenta tu existencia de vez en cuando","Un conteo real cada mes, en la pestaña Inversión, corrige errores y te muestra si hay productos vencidos o perdidos."],["Pide los acuerdos por escrito","Si negocias un atraso con el operador, el banco o el dueño del local, pide que quede escrito y con fechas."],["Revisa la tarjeta","La fecha de corte no es la fecha de pago. Confirma las dos en tu aplicación del banco y agrégala en Pagos."],["Un hábito pequeño sirve más que uno perfecto","Si un día no anotaste, vuelve al siguiente y sigue. Puedes completar días anteriores con las flechas de Hoy."]];
var h=BK+'<h1>Tips para llevar las cuentas</h1><p class="sub">Consejos básicos de orden.</p>'+ex+'<div class="card">';T.forEach(function(x){h+='<div class="tip"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'});
$("v").innerHTML=h+'</div><div class="note">Son consejos generales de organización, no asesoría financiera.</div>'}
/* ajustes */
function seg(k,opts){var h='<div class="seg">';opts.forEach(function(o){h+='<button class="'+(S[k]===o[0]?"on":"")+'" onclick="setOpt(\''+k+'\','+JSON.stringify(o[0]).replace(/"/g,"&quot;")+')">'+o[1]+'</button>'});return h+'</div>'}
function setOpt(k,v){S[k]=v;save();draw()}
function vAj(){var h=BK+'<h1>Ajustes y respaldo</h1><p class="sub">&nbsp;</p>'+
'<div class="card"><h2>Tamaño de letra</h2>'+seg("fs",[[1,"Normal"],[1.15,"Grande"],[1.3,"Muy grande"]])+'<h2 style="margin-top:14px">Color</h2>'+seg("ac",[["verde","Verde"],["azul","Azul"],["morado","Morado"],["naranja","Naranja"]])+'<h2 style="margin-top:14px">Modo</h2>'+seg("mode",[["auto","Automático"],["light","Claro"],["dark","Oscuro"]])+'</div>'+
'<div class="card"><h2>Cifras</h2><span class="lbl" style="margin-top:0">Gasto diario estimado de comida y pasaje (RD$)</span>'+inp("es","0",S.est)+'<span class="lbl">Ganancia mensual de lotería (RD$)</span>'+inp("ga","0",S.gainA)+'</div>'+
'<div class="card"><h2>Respaldo de tus datos</h2><div class="sub" style="margin:0">Cópialo y pégalo en WhatsApp o en tus notas. Si cambias de teléfono o se borran los datos, pégalo aquí para restaurarlo.</div><button class="btn" id="bc">Copiar respaldo</button><textarea class="txt" id="bt" placeholder="Aquí aparece el respaldo. Para restaurar, pega aquí tu respaldo."></textarea><button class="btn" id="br">Restaurar desde el texto</button><div id="bm" class="note"></div></div>'+
'<div class="card"><button class="btn o" id="rs" style="margin-top:0">Borrar todos mis datos</button></div>';
$("v").innerHTML=h;
$("es").addEventListener("change",function(){S.est=num($("es").value);save()});$("ga").addEventListener("change",function(){S.gainA=num($("ga").value);save()});
$("bc").addEventListener("click",function(){var j=JSON.stringify(S);$("bt").value=j;$("bt").select();var ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(j).then(function(){$("bm").textContent="Copiado. Pégalo en WhatsApp o en tus notas."},function(){$("bm").textContent="Selecciona el texto de arriba y cópialo."});ok=true}}catch(e){}if(!ok)$("bm").textContent="Selecciona el texto de arriba y cópialo."});
$("br").addEventListener("click",function(){var o=null;try{o=JSON.parse($("bt").value)}catch(e){}if(!o||typeof o!=="object"||!o.days){$("bm").textContent="Ese texto no es un respaldo válido.";return}S=o;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}load();draw()});
var cf=false;$("rs").addEventListener("click",function(){if(!cf){cf=true;$("rs").textContent="Toca otra vez para borrar todo";return}try{localStorage.removeItem(KEY)}catch(e){}load();sub=null;draw()})}
load();sel=today();selW=wedOf(sel);selE=today();selM=new Date(today().getFullYear(),today().getMonth(),1);
var lastDay=iso(today());
document.addEventListener("visibilitychange",function(){if(document.visibilityState!=="visible")return;var k=iso(today());if(k!==lastDay){lastDay=k;sel=today();selW=wedOf(sel);selE=today()}draw()});
draw();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}catch(e){}
